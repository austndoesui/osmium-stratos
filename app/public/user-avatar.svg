<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern user avatar design matching the provided PNG -->
  <defs>
    <!-- Gradients for a more modern look -->
    <radialGradient id="headGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFB366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#74B9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0984E3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D3436;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#2D3436" opacity="0.05"/>
  
  <!-- Body/Torso (rounded rectangle) -->
  <path d="M 20 60 
           Q 20 50, 30 50
           L 70 50
           Q 80 50, 80 60
           L 80 90
           Q 80 95, 75 95
           L 25 95
           Q 20 95, 20 90
           Z" 
        fill="url(#bodyGradient)"/>
  
  <!-- Head (circle) -->
  <circle cx="50" cy="35" r="18" fill="url(#headGradient)"/>
  
  <!-- Subtle shadow -->
  <ellipse cx="50" cy="95" rx="25" ry="3" fill="#2D3436" opacity="0.1"/>
</svg>